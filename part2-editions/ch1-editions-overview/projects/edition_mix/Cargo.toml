# 에디션이 다른 세 크레이트를 하나로 묶는 워크스페이스의 매니페스트입니다.
# [package]가 없는 "가상 매니페스트"이고, 에디션은 멤버 패키지마다 따로 정합니다.
#
# - jobs_2015  : edition = "2015" 라이브러리. async, await를 함수 이름으로 씀
# - idgen_2021 : edition = "2021" 라이브러리. gen을 함수 이름으로 씀
# - app_2024   : edition = "2024" 바이너리. 위의 두 크레이트를 가져와 씀
#
# 실행 파일이 app_2024 하나뿐이라 이 디렉터리에서 `cargo run` 한 번으로 결과를 볼 수 있습니다.
#
# 저장소 루트의 Cargo.toml도 워크스페이스입니다. 이 파일에 [workspace]가 있으므로 Cargo는
# 이 디렉터리 아래의 크레이트를 루트 워크스페이스가 아니라 이 워크스페이스의 멤버로 다룹니다.
[workspace]
# 가상 매니페스트에는 edition이 없어서 의존성 리졸버의 버전을 에디션으로부터 정할 수 없습니다.
# 그래서 직접 적습니다. 리졸버는 Part 2 ch3·ch5와 Part 3에서 다룹니다.
resolver = "3"
members = ["jobs_2015", "idgen_2021", "app_2024"]
