# 같은 소스 파일(shared/main.rs)을 2021 에디션 패키지(e2021)와 2024 에디션 패키지(e2024)가 함께
# 컴파일하는 작은 워크스페이스입니다. 저장소 루트의 워크스페이스와는 분리되어 있습니다.
# 두 패키지는 각자의 라이브러리(src/lib.rs)도 가지고 있어서, 문서 테스트와 rustfmt가 에디션에 따라
# 어떻게 다르게 동작하는지도 비교합니다.
[workspace]
# 가상 매니페스트에는 edition이 없어서 리졸버 버전을 직접 적습니다. 빠뜨리면 리졸버 1이 쓰이고
# 경고가 납니다. 이 프로젝트에는 외부 의존성이 없어서 어느 리졸버든 결과는 같습니다.
resolver = "3"
members = ["e2021", "e2024"]
