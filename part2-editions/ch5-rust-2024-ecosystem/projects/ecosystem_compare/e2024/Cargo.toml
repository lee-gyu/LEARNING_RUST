# 2021과 2024를 비교하는 패키지 가운데 2024 에디션 쪽입니다.
# e2021/Cargo.toml과 패키지 이름, edition, 실행 파일 이름 끝의 숫자만 다릅니다.
[package]
name = "e2024"
version = "0.1.0"
edition = "2024"
publish = false

# 실행 파일은 두 패키지가 같은 소스 파일을 씁니다. 이름 끝에 에디션을 붙인 것은 두 패키지의
# 실행 파일이 같은 target/ 디렉터리에서 겹치지 않게 하려는 것입니다.
# 라이브러리(src/lib.rs)는 패키지마다 따로 있습니다.
[[bin]]
name = "ecosystem_2024"
path = "../shared/main.rs"
