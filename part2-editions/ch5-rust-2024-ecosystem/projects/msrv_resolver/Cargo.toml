# rust-version을 고려하는 리졸버(리졸버 3)를 확인하는 패키지입니다.
# 이 디렉터리만의 워크스페이스이므로 저장소 루트의 워크스페이스와 분리되어 있습니다.
[package]
name = "msrv_resolver"
version = "0.1.0"
# 2024 에디션은 resolver = "3"을 뜻합니다. 리졸버 3은 의존성의 버전을 고를 때 아래 rust-version과
# 맞는 버전을 먼저 고릅니다.
edition = "2024"
# "이 패키지는 rustc 1.85부터 지원한다"는 약속입니다. 1.85는 2024 에디션이 안정화된 버전이라
# 2024 에디션 패키지가 적을 수 있는 가장 낮은 값입니다.
rust-version = "1.85"
publish = false

[dependencies]
# smol_str 0.3.4 이후 버전은 rust-version이 1.89입니다. 리졸버 3은 0.3 범위 안에서 1.85와 맞는
# 가장 높은 버전(작성 시점에 0.3.2)을 고르고, 리졸버 2는 범위 안의 가장 높은 버전을 고릅니다.
# 실제로 고른 버전은 Cargo.lock에 적혀 있습니다.
smol_str = "0.3"

[workspace]
