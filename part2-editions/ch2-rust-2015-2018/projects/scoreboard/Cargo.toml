# 같은 점수표 프로그램을 2015 에디션판(app2015)과 2018 에디션판(app2018)으로 나란히 둔 워크스페이스입니다.
# [package]가 없는 "가상 매니페스트"입니다.
#
# - scorekit : 두 판이 함께 쓰는 라이브러리 크레이트. 2015 에디션으로 작성한 "옛 크레이트"입니다.
# - app2015  : 점수표 프로그램, 2015 에디션
# - app2018  : 같은 프로그램, 2018 에디션
#
# 이 디렉터리에서 실행합니다.
#   cargo run -p app2015
#   cargo run -p app2018
#
# 저장소 루트의 Cargo.toml도 워크스페이스입니다. 이 파일에 [workspace]가 있으므로 Cargo는
# 이 디렉터리 아래의 크레이트를 루트 워크스페이스가 아니라 이 워크스페이스의 멤버로 다룹니다.
#
# 가상 매니페스트에는 edition이 없어서 의존성 리졸버의 버전을 직접 적습니다(저장소 루트와 같은 "3").
# 적지 않으면 멤버의 에디션을 2021 이상으로 올렸을 때 Cargo가 경고를 냅니다. 리졸버는 Part 2의
# ch3-rust-2021과 Part 3에서 다룹니다. 이 프로젝트에는 외부 의존성이 없어서 동작에는 차이가 없습니다.
[workspace]
resolver = "3"
members = ["scorekit", "app2015", "app2018"]
