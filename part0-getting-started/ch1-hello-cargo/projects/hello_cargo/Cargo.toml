# 여기부터는 `cargo new`가 만든 내용이 아니라 이 저장소에서 덧붙인 부분입니다.
# 저장소 루트의 Cargo.toml이 모든 챕터를 하나로 묶는 워크스페이스라서, 그 아래에
# 있는 이 프로젝트는 그대로 두면 "워크스페이스에 속한다고 생각하지만 멤버가 아니다"라는
# 에러로 빌드되지 않습니다. 빈 [workspace] 테이블은 "이 프로젝트가 스스로 워크스페이스의
# 루트"라고 선언해, 바깥 워크스페이스와 분리된 독립 프로젝트로 만듭니다.
