[package]
name = "collatz"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chain = { path = "chain" }
thiserror = "2.0.21"

# 저장소의 루트 워크스페이스와 분리합니다. 프로필은 워크스페이스 루트의 매니페스트에만 적을 수 있습니다.
[workspace]

# dev를 물려받고, 계산이 몰린 `chain` 패키지만 최적화합니다.
[profile.dev-hot]
inherits = "dev"

[profile.dev-hot.package.chain]
opt-level = 3

# release를 물려받고, 실행 파일 크기를 줄이는 설정을 모았습니다.
[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# dev를 물려받고, 디버그 정보를 줄입니다(Cargo Book "Optimizing Build Performance"의 권장).
[profile.lean]
inherits = "dev"
debug = "line-tables-only"

[profile.lean.package."*"]
debug = false
