# 이 디렉터리 아래에서는 crates.io 대신 vendor/ 디렉터리를 레지스트리로 씁니다(소스 교체).
# vendor/에는 가상의 크레이트 tint(1.0.0, 1.1.0, 1.2.0, 2.0.0, 2.1.0-beta.1)와 banner(0.3.0)가 들어 있어,
# 네트워크 없이 Cargo가 버전을 고르는 모습을 언제 실행해도 같은 결과로 볼 수 있습니다.
# 경로는 이 .cargo 디렉터리를 담은 디렉터리(resolver-lab)를 기준으로 합니다.
[source.crates-io]
replace-with = "practice-registry"

[source.practice-registry]
directory = "vendor"
