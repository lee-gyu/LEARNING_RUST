# 게시하지 않는 애플리케이션입니다. path 의존성 하나에 version이 없지만
# publish = false이므로 게시 규칙의 대상이 아닙니다.
[package]
name = "ledger-cli"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
ledger-core = { path = "../ledger-core", version = "0.1.0" }
ledger-report = { path = "../ledger-report" }
