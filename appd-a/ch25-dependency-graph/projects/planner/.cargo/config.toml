# 이 디렉터리(projects/planner) 아래에서 실행하는 cargo는 crates.io 대신 vendor/를 씁니다.
# vendor/에는 연습용으로 "게시된 것으로 치는" 크레이트 12개가 들어 있어서,
# 네트워크 없이 Cargo가 버전을 고르고 합치는 동작을 실제 레지스트리처럼 볼 수 있습니다.
# 상대 경로는 이 .cargo 디렉터리를 담은 디렉터리(projects/planner)를 기준으로 합니다.
[source.crates-io]
replace-with = "practice-registry"

[source.practice-registry]
directory = "vendor"
