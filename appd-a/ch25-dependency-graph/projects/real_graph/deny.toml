# cargo-deny 설정 예시입니다(ch25 README 2.5절).
#
# 주의: 이 저장소에는 cargo-deny가 설치돼 있지 않아서 이 파일로 실제로 검사를 돌려 보지 못했습니다.
# 키 이름과 값은 2026-11-19에 cargo-deny 문서(https://embarkstudios.github.io/cargo-deny/)의
# [graph], [advisories], [licenses], [bans], [sources] 설정 절에서 확인한 것만 썼습니다.
#
# 설치한 뒤 이 디렉터리에서 실행합니다.
#   cargo deny check            # 네 검사를 모두
#   cargo deny check bans       # 하나만

[graph]
# 실제로 빌드하는 타깃만 봅니다. 적지 않으면 모든 플랫폼의 의존성이 검사 대상입니다.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
# 기본값으로 RustSec 권고 데이터베이스(https://github.com/RustSec/advisory-db)를 내려받아 대조합니다.
# 권고를 무시해야 하면 ID와 이유를 함께 적어 두고, 이유가 사라지면 지웁니다.
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "이 크레이트의 해당 기능을 쓰지 않음" },
]
# 게시 취소(yank)된 버전이 Cargo.lock에 있으면 실패시킵니다(기본값은 "warn").
yanked = "deny"

[licenses]
# 여기에 적지 않은 라이선스는 거부됩니다. 목록은 `cargo tree -f "{p} {l}"`로 본 라이선스에서 골랐습니다.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
# 같은 크레이트의 여러 버전을 실패로 다룹니다(기본값은 "warn").
multiple-versions = "deny"
# 버전 요구 사항 "*"을 실패로 다룹니다(ch21 2.2절).
wildcards = "deny"
# 지금 고칠 수 없는 중복은 이유를 적어 건너뜁니다.
skip = [
    { crate = "syn@2.0.119", reason = "derive_builder 0.20.2가 darling 0.20(syn 2)을 씀. syn 3을 쓰는 판이 나오면 지운다" },
]
# 들이지 않기로 한 크레이트를 적습니다. 다른 의존성을 거쳐 들어와도 걸립니다.
deny = [
    # { crate = "openssl", reason = "네이티브 라이브러리가 필요함", use-instead = "rustls" },
]

[sources]
# crates.io 말고 다른 레지스트리나 git 저장소에서 온 패키지를 실패로 다룹니다.
unknown-registry = "deny"
unknown-git = "deny"
