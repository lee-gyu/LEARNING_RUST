[package]
name = "panic_strategy"
version = "0.1.0"
edition = "2024"
publish = false

# 저장소 루트의 워크스페이스와 분리합니다. 아래 [profile]은 워크스페이스 루트에서만 적용되므로,
# 이 패키지가 스스로 루트가 되어야 합니다.
[workspace]

# `cargo run --profile abort`로 고르는 사용자 정의 프로필입니다.
# 디버그 빌드(dev)의 설정을 물려받고 패닉 전략만 abort(중단)로 바꿉니다.
[profile.abort]
inherits = "dev"
panic = "abort"
