# cargo-deny 설정입니다. ci.sh의 deny 단계(bans, licenses, sources)와
# advisories 단계가 읽습니다.
#
# 주의: 이 저장소에는 cargo-deny가 설치되어 있지 않아 이 파일로 실제로 검사를 돌려 보지
# 못했습니다. 키 이름은 ch25의 projects/real_graph/deny.toml이 cargo-deny 문서에서
# 확인한(2026-11-19) 것만 썼습니다. pollcount에는 의존성이 없으므로, 의존성을 들이는 순간부터
# 이 정책이 의미를 가집니다.

[advisories]
# 게시 취소(yank)된 버전이 Cargo.lock에 있으면 실패시킵니다.
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
