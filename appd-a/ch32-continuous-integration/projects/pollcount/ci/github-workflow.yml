# pollcount의 GitHub Actions 워크플로 예시입니다(ch32 README 2.5·2.6절).
#
# - 실제로 쓰려면 저장소 루트의 .github/workflows/ 아래(예: .github/workflows/ci.yml)에 두어야
#   합니다. 이 위치(projects/pollcount/ci/)의 파일은 GitHub가 읽지 않으므로 실행되지 않습니다.
# - 이 파일은 GitHub에서 실행해 확인하지 못했습니다. YAML 문법만 확인했습니다(ruby -ryaml).
# - 액션의 커밋 SHA와 도구 버전은 2026-11-20에 git ls-remote로 확인한 것입니다.
# - 검사 명령은 모두 ci.sh에 있습니다. 이 파일에는 환경 준비(툴체인·도구 설치)와
#   "어느 검사를 언제 돌리는가"만 둡니다. 실패한 작업은 로그의 명령을 로컬에서 그대로 돌려 재현합니다.

name: pollcount CI

on:
  pull_request:            # 리뷰 요청마다(PR을 열거나 커밋을 더할 때). 포크의 PR에는 비밀이 전달되지 않습니다.
  push:
    branches: [main]       # 메인에 병합될 때마다
  schedule:
    - cron: "0 18 * * 0"   # 매주 일요일 18:00 UTC(한국 시간 월요일 03:00), 기본 브랜치에서
  workflow_dispatch:       # Actions 탭에서 손으로

# 모든 작업의 GITHUB_TOKEN을 저장소 읽기로 좁힙니다. 하나라도 적으면 적지 않은 권한은 none이 됩니다.
permissions:
  contents: read

# 같은 PR이나 브랜치에 새 커밋이 오면 진행 중인 실행을 취소합니다. 사람이 보는 것은 마지막 결과뿐입니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # shell을 적으면 bash --noprofile --norc -eo pipefail {0}로 실행되어, 파이프 안의 실패가
    # 단계의 실패가 됩니다. 적지 않으면 bash -e {0}입니다(README 2.4절, 예제 02).
    shell: bash
    # 이 저장소에서는 프로젝트가 하위 디렉터리에 있습니다. 프로젝트가 저장소 루트라면 이 줄을 지웁니다.
    working-directory: appd-a/ch32-continuous-integration/projects/pollcount

env:
  CARGO_TERM_COLOR: always

jobs:
  # (나) 리뷰 요청마다: 빠르고 결정적인 검사를 한 환경에서.
  quick:
    name: 빠른 검사
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 외부 액션은 태그가 아니라 커밋 SHA로 고정하고, 사람이 읽을 버전을 주석으로 붙입니다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 토큰을 .git/config에 남기지 않습니다(뒤 단계는 push하지 않음)
      # rust-toolchain.toml에 적힌 툴체인(1.100.0)과 구성 요소(clippy, rustfmt)를 설치합니다.
      - run: rustup toolchain install
      - run: sh ci.sh --keep-going lockfile fmt conventions clippy test examples docs

  # 서로 독립인 검사를 매트릭스로 나눠 동시에 돌립니다. 항목마다 필요한 준비물을 함께 적습니다.
  checks:
    name: ${{ matrix.step }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # 하나가 실패해도 나머지를 끝까지 돌려 실패를 한 번에 보여 줍니다
      matrix:
        include:
          - step: features
          - step: msrv
            setup: rustup toolchain install 1.98.1 --profile minimal   # ci.sh의 MSRV_TOOLCHAIN
          - step: deny
            setup: cargo install --locked cargo-deny@0.22.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - if: matrix.setup
        run: ${{ matrix.setup }}
      - run: sh ci.sh ${{ matrix.step }}

  # (다) 메인에 병합될 때마다: 지원하는 모든 운영체제에서 테스트와 예제 프로그램.
  test-all-os:
    name: 테스트 (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: sh ci.sh --keep-going test examples

  # (라) 정기 예약: 코드가 그대로여도 결과가 바뀌는 검사와 오래 걸리는 검사.
  scheduled:
    name: 정기 검사
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.22.0 cargo-hack@0.6.46
      - run: sh ci.sh --keep-going advisories hack

  # (라) 정기 예약: Cargo.lock을 무시하고 최신 의존성으로 빌드·테스트합니다(라이브러리 사용자의 상황).
  # 의존성 쪽의 문제일 수 있으므로 실패해도 실행 전체를 실패로 만들지 않습니다.
  latest-deps:
    name: 최신 의존성
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      # rust-version 때문에 새 버전이 걸러지지 않게 합니다(Cargo Book의 예와 같음).
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo update --verbose
      - run: sh ci.sh --keep-going test

  # 브랜치 보호 규칙에 "필수 검사"로 걸 작업 하나입니다. 매트릭스 항목이 늘어도 규칙을 고칠 필요가 없습니다.
  # 건너뛴(skipped) 작업은 성공으로 치므로, 앞 작업이 실패해도 이 작업이 돌도록 !cancelled()를 씁니다.
  ci-ok:
    name: CI 결과
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    needs: [quick, checks, test-all-os]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # 체크아웃하지 않으므로 프로젝트 디렉터리가 없습니다
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
