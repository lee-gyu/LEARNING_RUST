# 글롭 판 사용자 코드(shared/glob_import.rs) × templog 1.0.0 → 빌드 성공
[package]
name = "glob-on-v1-0"
version = "0.1.0"
edition = "2024"
publish = false

# 소스는 패키지 밖의 shared/에 있고, 다른 패키지와 같은 파일을 함께 씁니다.
[[bin]]
name = "glob-on-v1-0"
path = "../shared/glob_import.rs"

[dependencies]
# path 의존성: crates.io 대신 디스크의 디렉터리에서 크레이트를 가져옵니다.
# 어느 스냅숏을 가리키는지만 패키지마다 다르고, 코드에서는 모두 `templog`로 씁니다.
templog = { path = "../templog-1.0.0" }
