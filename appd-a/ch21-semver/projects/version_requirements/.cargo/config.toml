# 이 프로젝트 안에서는 crates.io 대신 vendor/ 디렉터리를 레지스트리로 씁니다.
# vendor/에는 parcel 0.3.9, 0.4.0, 1.4.7, 1.4.12, 1.6.0, 2.0.0이 들어 있어서,
# 네트워크 없이 "여러 버전이 게시된 크레이트"에서 Cargo가 어느 버전을 고르는지 볼 수 있습니다.
# 상대 경로는 이 .cargo 디렉터리를 담은 디렉터리(projects/version_requirements)를 기준으로 합니다.
[source.crates-io]
replace-with = "practice-registry"

[source.practice-registry]
directory = "vendor"
