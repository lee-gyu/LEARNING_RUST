# 라이브러리 receipt의 1.0.0 스냅숏입니다. money 0.3의 타입이 공개 API에 드러나지만 재내보내지 않습니다.
# receipt-1.1.0과 패키지 이름이 같아 한 워크스페이스의 멤버가 될 수 없으므로 자기 [workspace]를 가집니다.
[package]
name = "receipt"
version = "1.0.0"
edition = "2024"
